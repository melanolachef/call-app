# Fly.io: https://fly.io/docs/reference/configuration/
# Nome do app no Fly.io (endereço: https://cpx-call.fly.dev).
app = "cpx-call"
primary_region = "gru" # São Paulo

[build]

[env]
  PORT = "3000"
  MAX_PEERS = "12"
  # Contas (docs/CONTAS.md): o banco fica no volume "dados" (crie antes do
  # deploy: fly volumes create dados --size 1 --region gru).
  DATABASE_PATH = "/data/cpx.db"
  PUBLIC_URL = "https://cpx-call.fly.dev"

[mounts]
  source = "dados"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # As salas ficam em memória: a máquina não pode desligar sozinha nem ter cópias.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
