<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CPX Call</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/common.css">
  <script src="/theme.js"></script>
  <style>
    .top { display: flex; align-items: center; gap: 10px; padding: 18px 32px; }
    .top .brand { margin: 0; font-size: 15px; font-weight: 600; }
    .top-end { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .me-pill { display: flex; align-items: center; gap: 10px; min-width: 0; height: 36px; padding: 4px 12px 4px 4px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--card); font-size: 14px; }
    .me-pill .avatar { width: 28px; height: 28px; font-size: 12px; }
    .me-pill span { max-width: 22ch; }
    .top .icon-btn, .top .get-app { height: 36px; }
    .top .icon-btn { width: 36px; background: var(--card); }
    .get-app { background: var(--card); font-weight: 500; }

    .lobby { width: min(880px, calc(100vw - 32px)); margin: 0 auto; padding: 56px 0 64px; display: flex; flex-direction: column; gap: 28px; }
    .hello { display: flex; flex-direction: column; gap: 6px; }
    .hello h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; }
    .hello p { margin: 0; font-size: 17px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .panel { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .panel h2 { margin: 0; font-size: 17px; font-weight: 600; }
    .panel .btn { width: 100%; }
    .rooms { display: flex; flex-direction: column; gap: 8px; }
    .rooms .section-title { padding-left: 4px; }
    #rooms { list-style: none; margin: 0; padding: 4px 0; }
    #rooms li + li { border-top: 1px solid var(--border-strong); margin-left: 70px; }
    #rooms li + li .room-item { margin-left: -70px; }
    .room-item { position: relative; display: flex; align-items: center; padding-right: 12px; }
    .room-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 12px 8px 12px 20px; color: var(--text); text-decoration: none; }
    .room-icon { flex: none; width: 36px; height: 36px; border-radius: var(--r-md); background: var(--raised); color: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-transform: lowercase; }
    .room-icon svg { width: 18px; height: 18px; }
    .room-text { display: flex; flex-direction: column; min-width: 0; }
    .room-text strong { font-weight: 500; }
    .room-meta { font-size: 13px; color: var(--muted); }
    .room-count { margin-left: auto; flex: none; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .room-count.online::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: var(--online); }
    .chevron { flex: none; width: 14px; height: 14px; stroke: var(--faint); stroke-width: 2.4; }
    .room-link:hover .room-text strong { text-decoration: underline; }
    /* Pin / remove: quiet until the row is hovered or focused. */
    .room-actions { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; padding-left: 12px; background: var(--card); opacity: 0; transition: opacity .12s; }
    .room-item:hover .room-actions, .room-item:focus-within .room-actions { opacity: 1; }
    .ghost { width: 32px; height: 32px; padding: 0; border-radius: var(--r-md); background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
    .ghost svg { width: 16px; height: 16px; }
    .ghost:hover { color: var(--text); background: var(--raised); }
    .ghost[aria-pressed="true"] { color: var(--warn); opacity: 1; }
    .empty { margin: 0; padding: 4px 20px 16px; font-size: 13px; color: var(--muted); }

    @media (hover: none) { .room-actions { opacity: 1; } }
    @media (max-width: 760px), (max-height: 500px) and (pointer: coarse) {
      .top { padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); }
      .me-pill span, #get-app { display: none; }
      .me-pill { padding-right: 4px; }
      .lobby { padding-top: 24px; gap: 22px; }
      .hello h1 { font-size: 32px; }
      .hello p { font-size: 15px; }
      .grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div>
    <p class="brand">CPX Call</p>
    <div class="top-end">
      <a class="btn small get-app round" id="get-app" href="https://github.com/melanolachef/call-app/releases/latest/download/CPX-Call-Windows.exe" title="Atalhos de voz que funcionam com o jogo em foco" hidden>Baixar app para Windows</a>
      <button class="btn small round get-app" id="install" title="Abre sem as barras do navegador, com a tela inteira para a live" hidden>Instalar</button>
      <button class="icon-btn" id="appearance-btn" title="Aparência" aria-label="Aparência"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.8-.4-1.1-.3-.3-.4-.6-.4-1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.3-4-7.7-9-7.7z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/></svg></button>
      <button class="me-pill" id="edit" title="Editar perfil">
        <div class="avatar" id="me-avatar" aria-hidden="true"></div>
        <span class="ellipsis" id="me-nick"></span>
      </button>
    </div>
  </header>

  <main class="lobby">
    <div class="hello">
      <h1 id="greeting">Olá.</h1>
      <p id="tagline">Abra uma sala e mande o link para a galera.</p>
    </div>

    <div class="grid">
      <form class="panel card" id="create-form">
        <h2>Nova sala</h2>
        <label class="sr-only" for="room-name">Nome da sala (opcional)</label>
        <input class="input" id="room-name" maxlength="40" placeholder="Nome (opcional)" autocomplete="off">
        <button class="btn primary">Criar sala</button>
      </form>

      <form class="panel card" id="join-form">
        <h2>Entrar com convite</h2>
        <label class="sr-only" for="join-link">Link ou código da sala</label>
        <input class="input" id="join-link" placeholder="Cole o link ou o código" autocomplete="off">
        <button class="btn">Entrar</button>
      </form>
    </div>

    <section class="rooms" aria-labelledby="rooms-title">
      <h2 class="section-title" id="rooms-title">Suas salas</h2>
      <div class="card">
        <ul id="rooms" aria-labelledby="rooms-title"></ul>
        <p class="empty" id="rooms-empty">As salas por onde você passar ficam aqui, com quem está nelas agora.</p>
      </div>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/lobby.js"></script>
</body>
</html>
