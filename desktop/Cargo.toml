[package]
name = "cpx-call-desktop"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "CPX Call para Windows: a sala do navegador numa janela própria, com atalhos que funcionam com o jogo em primeiro plano"

# Separate from the server crate: `cargo build` at the repository root and the
# Dockerfile never compile this.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
