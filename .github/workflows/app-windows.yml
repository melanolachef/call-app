# Builds the Windows installer of the CPX Call app (desktop/).
# A tag like `app-v0.1.0` publishes it on GitHub Releases, where the lobby's
# "Baixar app para Windows" button points. Running it by hand (Actions tab)
# only builds and keeps the installer as an artifact, to try it out.
name: App para Windows

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Instalar o tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compilar o instalador
        working-directory: desktop
        run: cargo tauri build

      # A fixed name, so .../releases/latest/download/CPX-Call-Windows.exe
      # always downloads the newest version.
      - name: Dar nome fixo ao instalador
        shell: bash
        run: cp desktop/target/release/bundle/nsis/*-setup.exe CPX-Call-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: CPX-Call-Windows
          path: CPX-Call-Windows.exe

      - name: Publicar no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" CPX-Call-Windows.exe
          --title "CPX Call para Windows ${GITHUB_REF_NAME#app-v}"
          --notes "Instale e abra: é a mesma sala do navegador, com a tecla de falar e o Ctrl+Shift+M funcionando com o jogo em foco. O Windows pode avisar que o app não é reconhecido (ainda não é assinado): clique em Mais informações e Executar assim mesmo."
