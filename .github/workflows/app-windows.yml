# Builds the Windows installer of the CPX Call app (desktop/).
# A tag like `app-v0.1.0` publishes it on GitHub Releases, where the lobby's
# "Baixar app para Windows" button points. Running it by hand (Actions tab)
# only builds and keeps the installer as an artifact, to try it out.
name: App para Windows

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Instalar o tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compilar o instalador
        working-directory: desktop
        run: cargo tauri build

      # A fixed name, so .../releases/latest/download/CPX-Call-Windows.exe
      # always downloads the newest version.
      - name: Dar nome fixo ao instalador
        shell: bash
        run: cp desktop/target/release/bundle/nsis/*-setup.exe CPX-Call-Windows.exe

      - uses: actions/upload-artifact@v7
        id: unsigned
        with:
          name: CPX-Call-Windows
          path: CPX-Call-Windows.exe

      # Free code signing by the SignPath Foundation (CODE_SIGNING_POLICY.md).
      # Skipped until the repository variables in docs/APP-WINDOWS.md exist;
      # the installer then ships unsigned, as before.
      - name: Assinar (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Usar o instalador assinado
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: cp signed/CPX-Call-Windows.exe CPX-Call-Windows.exe

      - name: Publicar no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          notes="Instale e abra: é a mesma sala do navegador, com a tecla de falar e o Ctrl+Shift+M funcionando com o jogo em foco."
          if [ "$SIGNED" = true ]; then
            notes="$notes O instalador é assinado pela SignPath Foundation. Nas primeiras versões, o Windows ainda pode avisar enquanto o certificado ganha reputação: Mais informações › Executar assim mesmo."
          else
            notes="$notes O Windows pode avisar que o app não é reconhecido (ainda não é assinado): clique em Mais informações e Executar assim mesmo."
          fi
          gh release create "$GITHUB_REF_NAME" CPX-Call-Windows.exe             --title "CPX Call para Windows ${GITHUB_REF_NAME#app-v}"             --notes "$notes"
