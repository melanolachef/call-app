# Builds the Windows installer of the CPX Call app (desktop/).
# A tag like `app-v0.1.0` publishes it on GitHub Releases, where the lobby's
# "Baixar app para Windows" button points. Running it by hand (Actions tab)
# only builds and keeps the installer as an artifact, to try it out.
name: App para Windows

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Instalar o tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compilar o instalador
        working-directory: desktop
        env:
          # The updater's public key (#186): builds without it don't look for updates.
          CPX_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: cargo tauri build

      # A fixed name, so .../releases/latest/download/CPX-Call-Windows.exe
      # always downloads the newest version.
      - name: Dar nome fixo ao instalador
        shell: bash
        run: cp desktop/target/release/bundle/nsis/*-setup.exe CPX-Call-Windows.exe

      - uses: actions/upload-artifact@v7
        id: unsigned
        with:
          name: CPX-Call-Windows
          path: CPX-Call-Windows.exe

      # Free code signing by the SignPath Foundation (CODE_SIGNING_POLICY.md).
      # Skipped until the repository variables in docs/APP-WINDOWS.md exist;
      # the installer then ships unsigned, as before.
      - name: Assinar (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Usar o instalador assinado
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: cp signed/CPX-Call-Windows.exe CPX-Call-Windows.exe

      # Automatic updates (#186): sign the final installer (after SignPath, if
      # any) bound to its version, and describe it in latest.json, which the
      # app reads from releases/latest. Skipped until the key exists.
      - name: Assinar para a atualização automática
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./desktop/tauri.conf.json').version")
          if [[ "$GITHUB_REF_NAME" == app-v* && "${GITHUB_REF_NAME#app-v}" != "$version" ]]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $version do tauri.conf.json"; exit 1
          fi
          cargo tauri signer sign --app-version "$version" CPX-Call-Windows.exe
          VERSION="$version" TAG="$GITHUB_REF_NAME" node -e '
            const fs = require("fs");
            const url = `https://github.com/melanolachef/call-app/releases/download/${process.env.TAG}/CPX-Call-Windows.exe`;
            fs.writeFileSync("latest.json", JSON.stringify({
              version: process.env.VERSION,
              notes: "Nova versão do CPX Call para Windows.",
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: fs.readFileSync("CPX-Call-Windows.exe.sig", "utf8"), url } },
            }, null, 2));
          '
          cat latest.json

      - name: Publicar no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          install="Instale e abra: é a mesma sala do navegador, com a tecla de falar e o Ctrl+Shift+M funcionando com o jogo em foco."
          if [ "$SIGNED" = true ]; then
            install="$install O instalador é assinado pela SignPath Foundation. Nas primeiras versões, o Windows ainda pode avisar enquanto o certificado ganha reputação: Mais informações › Executar assim mesmo."
          else
            install="$install O Windows pode avisar que o app não é reconhecido (ainda não é assinado): clique em Mais informações e Executar assim mesmo."
          fi
          # What's new: this version's "## X.Y.Z" section of desktop/NOVIDADES.md.
          version="${GITHUB_REF_NAME#app-v}"
          news=$(awk -v head="## $version" '$0 == head { on = 1; next } /^## / { on = 0 } on' desktop/NOVIDADES.md | sed -e '/./,$!d')
          if [ -n "$news" ]; then
            notes=$(printf '## Novidades\n\n%s\n\n%s' "$news" "$install")
          else
            echo "::warning::desktop/NOVIDADES.md não tem a seção ## $version: o release sai sem as novidades."
            notes="$install"
          fi
          files=(CPX-Call-Windows.exe)
          [ -f latest.json ] && files+=(latest.json CPX-Call-Windows.exe.sig)
          gh release create "$GITHUB_REF_NAME" "${files[@]}"             --title "CPX Call para Windows ${GITHUB_REF_NAME#app-v}"             --notes "$notes"
